services:
  - type: web
    name: workout-tracker
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      # Server-only service role key (bypasses RLS). Set in the Render dashboard;
      # never commit its value.
      - key: SUPABASE_SERVICE_KEY
        sync: false
      # Shared secret for /api/cron/* endpoints (X-Cron-Secret header).
      - key: CRON_SECRET
        sync: false
