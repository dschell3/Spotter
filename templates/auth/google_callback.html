<!DOCTYPE html>
<html>
<head>
    <title>Signing in...</title>
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            background: #121212;
            color: white;
            font-family: system-ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .loader {
            text-align: center;
        }
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top-color: #22d3ee;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p id="status">Signing you in...</p>
    </div>
    
    <script>
        const SUPABASE_URL = '{{ config.SUPABASE_URL }}';
        const SUPABASE_KEY = '{{ config.SUPABASE_KEY }}';
        
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
        const CSRF_TOKEN = document.querySelector('meta[name="csrf-token"]')?.content || '';

        // POST the verified tokens to the server in the request body (never the URL,
        // which would leak bearer tokens into logs and browser history).
        async function completeSignin(session) {
            const response = await fetch('/auth/google/complete', {
                method: 'POST',
                credentials: 'same-origin',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': CSRF_TOKEN
                },
                body: JSON.stringify({
                    access_token: session.access_token,
                    refresh_token: session.refresh_token || ''
                })
            });

            if (response.ok) {
                window.location.href = '/';
            } else {
                window.location.href = '/login?error=' + encodeURIComponent('google_signin_failed');
            }
        }

        async function handleCallback() {
            try {
                // Get session from URL (Supabase JS handles PKCE automatically)
                const { data, error } = await supabaseClient.auth.getSession();

                if (error) {
                    console.error('Session error:', error);
                    document.getElementById('status').textContent = 'Sign-in failed...';
                    setTimeout(() => {
                        window.location.href = '/login?error=' + encodeURIComponent(error.message);
                    }, 1000);
                    return;
                }

                if (data.session) {
                    await completeSignin(data.session);
                } else {
                    // No session yet, try to exchange code
                    const params = new URLSearchParams(window.location.search);
                    const code = params.get('code');

                    if (code) {
                        const { data: exchangeData, error: exchangeError } = await supabaseClient.auth.exchangeCodeForSession(code);

                        if (exchangeError) {
                            console.error('Exchange error:', exchangeError);
                            window.location.href = '/login?error=' + encodeURIComponent(exchangeError.message);
                            return;
                        }

                        if (exchangeData.session) {
                            await completeSignin(exchangeData.session);
                            return;
                        }
                    }

                    // Fallback - no session or code
                    window.location.href = '/login?error=no_session';
                }
            } catch (err) {
                console.error('Callback error:', err);
                window.location.href = '/login?error=' + encodeURIComponent(err.message);
            }
        }

        handleCallback();
    </script>
</body>
</html>
